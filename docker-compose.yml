# Scriba Executive Desk in Docker.
#
#   docker compose up desk                          live workspace, hot reload    http://localhost:5173
#   docker compose --profile demo up desk-demo      mock data, no backend needed  http://localhost:5174
#   docker compose --profile prod up --build desk-prod   production build (nginx) http://localhost:5173
#   docker compose --profile test run --rm frontend-tests
#   docker compose --profile test run --rm backend-tests
#
# The live workspace talks to a Scriba API from the *browser*, so the API URL is the one the
# browser sees (default http://localhost:8000, set VITE_API_BASE_URL to change it). The page
# must be served on host port 5173: Scriba only trusts credentialed requests from that origin.

services:
  desk:
    build:
      context: ./frontend
      target: dev
    ports:
      - "5173:5173"
    environment:
      VITE_USE_POLLING: "1"
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    volumes:
      - ./frontend:/app
      # Keep the container's Linux node_modules; the host's (Windows) native binaries would break Vite.
      - /app/node_modules

  desk-demo:
    profiles: ["demo"]
    build:
      context: ./frontend
      target: dev
    command: ["npm", "run", "dev:demo", "--", "--host", "0.0.0.0", "--port", "5174"]
    ports:
      - "5174:5174"
    environment:
      VITE_USE_POLLING: "1"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  desk-prod:
    profiles: ["prod"]
    build:
      context: ./frontend
      target: prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_DESK_MODE: ${VITE_DESK_MODE:-}
    ports:
      - "5173:80"

  frontend-tests:
    profiles: ["test"]
    build:
      context: ./frontend
      target: test

  backend-tests:
    profiles: ["test"]
    build:
      context: ./backend
