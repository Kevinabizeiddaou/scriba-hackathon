# Scriba Executive Desk in Docker. This is the only supported way to run the app.
#
#   docker compose build
#   docker compose up -d                            seeded Scriba API (:8000) + the Desk, hot reload
#                                                   http://localhost:5173
#   docker compose down                             stop it
#
# Settings (all optional) go in a .env file next to this one: see .env.example.
# DESK_DEMO=on gives the seeded users synthetic mail and calendars that turn into runs.
#
# Other profiles:
#   docker compose --profile demo up desk-demo      frontend mock data, no backend  http://localhost:5174
#   docker compose --profile prod up --build desk-prod   production build (nginx) http://localhost:5173
#   docker compose --profile test run --rm frontend-tests
#   docker compose --profile test run --rm backend-tests   whole suite, overlay on the real Scriba app
#   docker compose --profile test run --rm smoke           API smoke test against the running api
#
# Ports are published on 127.0.0.1 only: nothing here is reachable from other machines.
# The live workspace talks to a Scriba API from the *browser*, so the API URL is the one the
# browser sees (default http://localhost:8000, set VITE_API_BASE_URL to change it). The page
# must be served on host port 5173: Scriba only trusts credentialed requests from that origin.
#
# "failed to get build context scriba" means the Scriba checkout is missing: see "Run it" in
# README.md (git clone https://github.com/ScribaAssist/Scriba ../scriba, or set SCRIBA_PATH).

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Scriba's seeded test backend (in-memory, no database, no providers, no model) with the Desk
# overlay. Needs a Scriba checkout outside this repo: SCRIBA_PATH is its Gmail/ directory.
# The api and backend-tests services share this image (backend/Dockerfile.seeded).
x-scriba-build: &scriba-build
  context: ./backend
  dockerfile: Dockerfile.seeded
  additional_contexts:
    scriba: ${SCRIBA_PATH:-../scriba/Gmail}

x-scriba-volumes: &scriba-volumes
  - ${SCRIBA_PATH:-../scriba/Gmail}:/scriba:ro
  # The checkout's root, read for its revision only (backend/dev/check_scriba.py).
  - ${SCRIBA_PATH:-../scriba/Gmail}/..:/scriba-repo:ro
  - ./backend:/desk:ro

services:
  api:
    build:
      <<: *scriba-build
      target: runtime
    logging: *logging
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DESK_DEMO: ${DESK_DEMO:-}
    volumes: *scriba-volumes
    healthcheck:
      # /live answers without a session or a database. Checked every 2 s while starting,
      # then every 30 s (each check is one line in Scriba's request log).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/live', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
      start_interval: 2s

  desk:
    build:
      context: ./frontend
      target: dev
    logging: *logging
    # Wait for the API so the first page load does not show "could not be reached".
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      VITE_USE_POLLING: "1"
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    volumes:
      - ./frontend:/app
      # Keep the container's Linux node_modules; the host's (Windows) native binaries would break Vite.
      - /app/node_modules

  desk-demo:
    profiles: ["demo"]
    build:
      context: ./frontend
      target: dev
    logging: *logging
    command: ["npm", "run", "dev:demo", "--", "--host", "0.0.0.0", "--port", "5174"]
    ports:
      - "127.0.0.1:5174:5174"
    environment:
      VITE_USE_POLLING: "1"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  desk-prod:
    profiles: ["prod"]
    build:
      context: ./frontend
      target: prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_DESK_MODE: ${VITE_DESK_MODE:-}
    logging: *logging
    ports:
      - "127.0.0.1:5173:80"

  # The frontend tests also read ../backend and ../docs, so those are mounted beside /app.
  frontend-tests:
    profiles: ["test"]
    build:
      context: ./frontend
      target: dev
    # Half the CPUs: with one worker per CPU the evaluation self-test (5 s per case) can run
    # out of time under load in the container; with half it passes and finishes sooner.
    command: ["sh", "-c", "npm run typecheck && npm test -- --maxWorkers=50%"]
    environment:
      # Some UI tests assert local clock times written for UTC+2 (the team's zone).
      TZ: ${TZ:-Asia/Beirut}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./backend:/backend:ro
      - ./docs:/docs:ro

  # The whole backend suite in the api's image: unit and route tests, and the overlay mounted
  # on the real Scriba app (tests/integration). The suite reads frontend/src/api/desk.ts.
  backend-tests:
    profiles: ["test"]
    build:
      <<: *scriba-build
      target: test
    volumes:
      - ${SCRIBA_PATH:-../scriba/Gmail}:/scriba:ro
      - ${SCRIBA_PATH:-../scriba/Gmail}/..:/scriba-repo:ro
      - ./backend:/desk:ro
      - ./frontend:/frontend:ro

  # Read-only API smoke test (scripts/smoke.mjs) against the api service. Signed-in checks need
  # SMOKE_EMAIL and SMOKE_PASSWORD (a seeded user, from Scriba's e2e/seeded_server.py) in the
  # environment. Extra arguments replace --desk, e.g. `run --rm smoke --desk-demo` with DESK_DEMO=on.
  smoke:
    profiles: ["test"]
    image: node:22-bookworm-slim
    depends_on:
      api:
        condition: service_healthy
    entrypoint: ["node", "/scripts/smoke.mjs", "--base", "http://api:8000"]
    command: ["--desk"]
    environment:
      SMOKE_EMAIL: ${SMOKE_EMAIL:-}
      SMOKE_PASSWORD: ${SMOKE_PASSWORD:-}
    volumes:
      - ./scripts:/scripts:ro
